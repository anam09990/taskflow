<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - TASKFLOW</title>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    .calendar-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .calendar-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .calendar-month-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: var(--border-subtle);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }
    .weekday-label {
      padding: 0.75rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: var(--border-color);
      gap: 1px;
    }
    .calendar-day {
      background-color: var(--bg-surface);
      min-height: 110px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }
    .calendar-day:hover {
      background-color: var(--border-subtle);
    }
    .calendar-day.other-month {
      background-color: var(--bg-app);
      opacity: 0.45;
      cursor: default;
    }
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .day-number {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
    }
    .day-number.today-pill {
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 800;
    }
    .today-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.05em;
    }
    .day-events {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow-y: auto;
      max-height: 85px;
    }
    .calendar-event-pill {
      font-size: 0.725rem;
      font-weight: 600;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      background-color: var(--border-subtle);
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: transform var(--transition-fast);
    }
    .calendar-event-pill:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand-logo">
          <div class="brand-icon">T</div>
          <span>TASKFLOW</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Workspace</div>
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/tasks" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </a>
        <a href="/projects" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Projects
        </a>
        <a href="/calendar" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </a>
        <a href="/analytics" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>

        <div class="nav-section-title" id="adminSectionTitle">System</div>
        <a href="/admin" class="nav-item" id="adminNavLink" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-profile">
          <div class="user-avatar" id="headerUserAvatar">U</div>
          <div class="user-info">
            <span class="user-name" id="headerUserName">User</span>
            <span class="user-role-badge" id="headerUserRole">Member</span>
          </div>
        </div>
        <button class="btn-icon" onclick="logout()" title="Logout" style="border: none; color: #ef4444;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title">Calendar & Deadlines</h1>
        </div>
        <div class="topbar-right">
          <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme"></button>
          <a href="/tasks" class="btn btn-primary">Manage Tasks</a>
        </div>
      </header>

      <main class="content-area">
        <div class="calendar-container">
          <div class="calendar-nav-bar">
            <h2 class="calendar-month-title" id="calendarMonthTitle">Loading Month...</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <button class="btn btn-secondary" onclick="prevMonth()" style="padding: 0.4rem 0.75rem;">‹ Prev</button>
              <button class="btn btn-secondary" onclick="goToToday()" style="padding: 0.4rem 0.85rem;">Today</button>
              <button class="btn btn-secondary" onclick="nextMonth()" style="padding: 0.4rem 0.75rem;">Next ›</button>
            </div>
          </div>

          <div class="calendar-weekdays">
            <div class="weekday-label">Sun</div>
            <div class="weekday-label">Mon</div>
            <div class="weekday-label">Tue</div>
            <div class="weekday-label">Wed</div>
            <div class="weekday-label">Thu</div>
            <div class="weekday-label">Fri</div>
            <div class="weekday-label">Sat</div>
          </div>

          <div class="calendar-grid" id="calendarGrid">
            <!-- Day cells populated dynamically -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Task from Calendar Modal -->
  <div class="modal-backdrop" id="calendarModalBackdrop" onclick="if(event.target === this) closeCalendarModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="card-title">Add Task for Date</h2>
        <button class="btn-icon" onclick="closeCalendarModal()" style="border: none;">✕</button>
      </div>
      <form id="calendarTaskForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="modalTaskTitle">Task Title *</label>
            <input type="text" id="modalTaskTitle" class="form-control" placeholder="Task name..." required maxlength="255" />
          </div>

          <div class="form-group">
            <label class="form-label" for="modalTaskProject">Project</label>
            <select id="modalTaskProject" class="form-control">
              <option value="">No Project (General)</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="modalTaskPriority">Priority</label>
              <select id="modalTaskPriority" class="form-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="modalTaskDueDate">Due Date *</label>
              <input type="date" id="modalTaskDueDate" class="form-control" required />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeCalendarModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="calendarModalSubmitBtn">Add to Calendar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('appSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active');
    }
  </script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/calendar.js"></script>
</body>
</html>
