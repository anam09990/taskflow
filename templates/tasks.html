<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - TASKFLOW</title>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    .tasks-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .status-tabs {
      display: flex;
      gap: 0.35rem;
      background-color: var(--border-subtle);
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }
    .status-tab-btn {
      padding: 0.4rem 0.85rem;
      font-size: 0.825rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: calc(var(--radius-sm) - 2px);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .status-tab-btn:hover {
      color: var(--text-primary);
    }
    .status-tab-btn.active {
      background-color: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .filters-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand-logo">
          <div class="brand-icon">T</div>
          <span>TASKFLOW</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Workspace</div>
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/tasks" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </a>
        <a href="/projects" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Projects
        </a>
        <a href="/calendar" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </a>
        <a href="/analytics" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>

        <div class="nav-section-title" id="adminSectionTitle">System</div>
        <a href="/admin" class="nav-item" id="adminNavLink" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-profile">
          <div class="user-avatar" id="headerUserAvatar">U</div>
          <div class="user-info">
            <span class="user-name" id="headerUserName">User</span>
            <span class="user-role-badge" id="headerUserRole">Member</span>
          </div>
        </div>
        <button class="btn-icon" onclick="logout()" title="Logout" style="border: none; color: #ef4444;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <h1 class="page-title">Tasks</h1>
            <span class="badge" id="taskCountBadge" style="background-color: var(--border-subtle); color: var(--text-secondary);">0 tasks</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme"></button>
          <button class="btn btn-primary" onclick="openCreateTaskModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Task
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Toolbar & Filter Bar -->
        <div class="tasks-toolbar">
          <div class="status-tabs">
            <button class="status-tab-btn active" data-status="all">All</button>
            <button class="status-tab-btn" data-status="todo">To Do</button>
            <button class="status-tab-btn" data-status="in_progress">In Progress</button>
            <button class="status-tab-btn" data-status="review">Review</button>
            <button class="status-tab-btn" data-status="done">Completed</button>
          </div>

          <div class="filters-row">
            <div style="position: relative; min-width: 220px;">
              <input
                type="text"
                id="taskSearchInput"
                class="form-control"
                placeholder="Search tasks..."
                style="padding-left: 2rem;"
              />
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>

            <select id="filterPrioritySelect" class="form-control" style="width: auto; min-width: 130px;">
              <option value="all">All Priorities</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>

            <select id="filterProjectSelect" class="form-control" style="width: auto; min-width: 140px;">
              <option value="all">All Projects</option>
            </select>
          </div>
        </div>

        <!-- Task Table Card -->
        <div class="card" style="margin-bottom: 2rem;">
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 40px; text-align: center;"></th>
                  <th>Task Title</th>
                  <th>Project</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Due Date</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="tasksTableBody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                    Loading tasks...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Task Modal -->
  <div class="modal-backdrop" id="taskModalBackdrop" onclick="if(event.target === this) closeTaskModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="card-title" id="taskModalTitle">Create New Task</h2>
        <button class="btn-icon" onclick="closeTaskModal()" style="border: none;">✕</button>
      </div>
      <form id="taskForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="taskTitle">Task Title *</label>
            <input type="text" id="taskTitle" class="form-control" placeholder="What needs to be done?" required maxlength="255" />
          </div>

          <div class="form-group">
            <label class="form-label" for="taskDescription">Description</label>
            <textarea id="taskDescription" class="form-control" rows="3" placeholder="Add additional context, notes, or details..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="taskProject">Project</label>
              <select id="taskProject" class="form-control">
                <option value="">No Project (General)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskPriority">Priority</label>
              <select id="taskPriority" class="form-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="taskStatus">Status</label>
              <select id="taskStatus" class="form-control">
                <option value="todo" selected>To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="taskDueDate">Due Date</label>
              <input type="date" id="taskDueDate" class="form-control" />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="taskModalSubmitBtn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('appSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active');
    }
  </script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/tasks.js"></script>
</body>
</html>
