<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASKFLOW - Task & Productivity Management</title>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 70%), var(--bg-app);
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      max-width: 800px;
      margin-bottom: 1.25rem;
      color: var(--text-primary);
    }
    .hero-title span {
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 620px;
      margin-bottom: 2.25rem;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <header class="nav-header">
      <a href="/" class="brand-logo" style="color: var(--text-primary);">
        <div class="brand-icon">T</div>
        <span>TASKFLOW</span>
      </a>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme"></button>
        <a href="/login" class="btn btn-secondary">Sign In</a>
      </div>
    </header>

    <div class="hero-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Built with Rust, Axum, SQLite & Tokio
    </div>

    <h1 class="hero-title">
      Streamline your tasks, projects, and <span>productivity</span>.
    </h1>

    <p class="hero-subtitle">
      A fast, resilient, and beautifully designed productivity platform engineered with memory safety and zero bloat.
    </p>

    <div class="hero-actions">
      <a href="/register" class="btn btn-primary" style="padding: 0.85rem 1.75rem; font-size: 1rem;">
        Get Started Free
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <a href="/login" class="btn btn-secondary" style="padding: 0.85rem 1.75rem; font-size: 1rem;">
        Open Workspace
      </a>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
</body>
</html>
